name: Bygg Android-APK

on:
  workflow_dispatch:        # knapp: Actions -> Bygg Android-APK -> Run workflow
  push:
    branches: [main, master]
    paths:
      - "android-app/**"
      - "app/**"
      - "static/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5   # Chaquopy behöver Python på byggmaskinen för att hämta paketen
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Hämta signeringsnyckel (om den finns som hemlighet)
        env:
          KS_B64: ${{ secrets.MR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MR_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "MR_KEYSTORE_PASSWORD=${{ secrets.MR_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MR_KEY_ALIAS=${{ secrets.MR_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MR_KEY_PASSWORD=${{ secrets.MR_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::Ingen signeringsnyckel hittades. APK:n får en tillfällig nyckel och kan inte installeras över en tidigare version."
          fi

      - name: Bygg APK
        working-directory: android-app
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Spara APK
        uses: actions/upload-artifact@v4
        with:
          name: Marknadsradar-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
